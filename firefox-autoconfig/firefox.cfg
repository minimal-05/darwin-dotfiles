// Two live hooks into the running browser, both through nsIStyleSheetService:
//
//   * ComicShanns font toggle -- ctrl+alt+cmd+U
//   * the quickshell palette  -- repaints the chrome when the colours change
//
// The palette used to arrive only through userChrome.css, which Firefox reads
// once at startup, so a wallpaper or scheme change left the browser on the old
// colours until it was restarted. Registering the same stylesheet here instead
// applies it to every open window immediately, and re-registering it when the
// file changes is what makes a colour change land live.
//
// No debug server, no red indicator.
try {
  var Cc = Components.classes, Ci = Components.interfaces;
  var sss = Cc["@mozilla.org/content/style-sheet-service;1"].getService(Ci.nsIStyleSheetService);
  var ios = Cc["@mozilla.org/network/io-service;1"].getService(Ci.nsIIOService);
  var prefs = Cc["@mozilla.org/preferences-service;1"].getService(Ci.nsIPrefBranch);
  var obs = Cc["@mozilla.org/observer-service;1"].getService(Ci.nsIObserverService);
  var dirs = Cc["@mozilla.org/file/directory_service;1"].getService(Ci.nsIProperties);

  // ---- font toggle -------------------------------------------------------
  var css = '@namespace url(http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul);\n* { font-family: "ComicShannsMono Nerd Font", monospace !important; }';
  var uri = ios.newURI("data:text/css;charset=utf-8," + encodeURIComponent(css));
  function isOn() { return sss.sheetRegistered(uri, sss.AGENT_SHEET); }
  function setFont(on) {
    if (on && !isOn()) sss.loadAndRegisterSheet(uri, sss.AGENT_SHEET);
    else if (!on && isOn()) sss.unregisterSheet(uri, sss.AGENT_SHEET);
    try { prefs.setIntPref("browser.display.use_document_fonts", on ? 0 : 1); } catch (e) {}
  }
  setFont(true);
  obs.addObserver({
    observe: function (win, topic) {
      if (topic !== "domwindowopened") return;
      win.addEventListener("load", function () {
        try {
          if (win.location.href !== "chrome://browser/content/browser.xhtml") return;
          win.addEventListener("keydown", function (e) {
            if (e.ctrlKey && e.altKey && e.metaKey && !e.shiftKey && e.code === "KeyU") {
              e.preventDefault(); e.stopPropagation();
              setFont(!isOn());
            }
          }, true);
        } catch (e) {}
      }, { once: true });
    }
  }, "domwindowopened", false);

  // ---- live palette ------------------------------------------------------
  // apply-apps.py writes this file on every colour change. It is the same file
  // userChrome.css imports, so a browser without this autoconfig still gets the
  // colours -- just not until it restarts.
  function paletteFile() {
    var f = dirs.get("ProfD", Ci.nsIFile);
    f.append("chrome");
    f.append("userChrome-quickshell.css");
    return f;
  }

  function readText(file) {
    var fstream = Cc["@mozilla.org/network/file-input-stream;1"].createInstance(Ci.nsIFileInputStream);
    var cstream = Cc["@mozilla.org/intl/converter-input-stream;1"].createInstance(Ci.nsIConverterInputStream);
    fstream.init(file, 0x01 /* PR_RDONLY */, 0, 0);
    cstream.init(fstream, "UTF-8", 0, 0);
    var chunk = {}, text = "";
    while (cstream.readString(4096, chunk) != 0) text += chunk.value;
    cstream.close();   // closes fstream too
    return text;
  }

  var palette = {
    timer: null,
    uri: null,
    stamp: 0,

    load: function () {
      var file = paletteFile();
      if (!file.exists()) return;
      // Content is reached through a data: URI rather than the file: one so
      // that each version is a distinct URI. Re-registering the same file:
      // URI would hand back the cached stylesheet and change nothing.
      if (file.lastModifiedTime === this.stamp) return;
      this.stamp = file.lastModifiedTime;
      var next = ios.newURI("data:text/css;charset=utf-8," + encodeURIComponent(readText(file)));
      // Swap rather than stack: the previous sheet has to be unregistered or
      // its rules stay in the cascade and fight the new ones.
      if (this.uri && sss.sheetRegistered(this.uri, sss.USER_SHEET))
        sss.unregisterSheet(this.uri, sss.USER_SHEET);
      sss.loadAndRegisterSheet(next, sss.USER_SHEET);
      this.uri = next;
    },

    // nsITimer callback. A USER_SHEET applies to every document, web pages
    // included, which is why the generated file wraps itself in
    // @-moz-document url-prefix("chrome://").
    notify: function () { try { palette.load(); } catch (e) {} },

    // Only here to give the observer service something to hold: it keeps a
    // strong reference to this object, which keeps the timer from being
    // collected out from under us.
    observe: function () {}
  };

  obs.addObserver(palette, "quit-application", false);
  palette.timer = Cc["@mozilla.org/timer;1"].createInstance(Ci.nsITimer);
  // A stat() every couple of seconds. There is no file-change notification
  // available to chrome JS, and polling one path costs nothing measurable.
  palette.timer.initWithCallback(palette, 2000, Ci.nsITimer.TYPE_REPEATING_SLACK);
  // ProfD may not be registered this early in startup; if it is not, the timer
  // picks it up on its first tick.
  try { palette.load(); } catch (e) {}
} catch (e) {
  Components.utils.reportError(e);
}
