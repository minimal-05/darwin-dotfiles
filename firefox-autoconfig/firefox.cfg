// ComicShanns live font toggle — ctrl+alt+cmd+U — no debug server, no red indicator
try {
  var Cc = Components.classes, Ci = Components.interfaces;
  var sss = Cc["@mozilla.org/content/style-sheet-service;1"].getService(Ci.nsIStyleSheetService);
  var ios = Cc["@mozilla.org/network/io-service;1"].getService(Ci.nsIIOService);
  var prefs = Cc["@mozilla.org/preferences-service;1"].getService(Ci.nsIPrefBranch);
  var obs = Cc["@mozilla.org/observer-service;1"].getService(Ci.nsIObserverService);
  var css = '@namespace url(http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul);\n* { font-family: "ComicShannsMono Nerd Font", monospace !important; }';
  var uri = ios.newURI("data:text/css;charset=utf-8," + encodeURIComponent(css));
  function isOn() { return sss.sheetRegistered(uri, sss.AGENT_SHEET); }
  function setFont(on) {
    if (on && !isOn()) sss.loadAndRegisterSheet(uri, sss.AGENT_SHEET);
    else if (!on && isOn()) sss.unregisterSheet(uri, sss.AGENT_SHEET);
    try { prefs.setIntPref("browser.display.use_document_fonts", on ? 0 : 1); } catch (e) {}
  }
  setFont(true);
  obs.addObserver({
    observe: function (win, topic) {
      if (topic !== "domwindowopened") return;
      win.addEventListener("load", function () {
        try {
          if (win.location.href !== "chrome://browser/content/browser.xhtml") return;
          win.addEventListener("keydown", function (e) {
            if (e.ctrlKey && e.altKey && e.metaKey && !e.shiftKey && e.code === "KeyU") {
              e.preventDefault(); e.stopPropagation();
              setFont(!isOn());
            }
          }, true);
        } catch (e) {}
      }, { once: true });
    }
  }, "domwindowopened", false);
} catch (e) {
  Components.utils.reportError(e);
}
